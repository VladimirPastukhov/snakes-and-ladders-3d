name: Deploy

on:
  push:
    branches: [main]

# Queue deploys one after another; never cancel one that is already running.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build client
        run: pnpm build
        env:
          APP_VERSION: ${{ github.sha }}

      - name: Deploy to Cloudflare
        run: pnpm --filter server exec wrangler deploy --var VERSION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Smoke test production
        run: pnpm smoke
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_VERSION: ${{ github.sha }}

      - name: Upload smoke test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
